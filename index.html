/* Layout de celular: conteúdo cabe na tela sem rolagem lateral. */
.shell, main, #content, .card, .grid > *, .fields > * { min-width:0; }
input, select, textarea { max-width:100%; }
@media (max-width:900px) {
  body { overflow-wrap:anywhere; }
  main { width:100%; margin:0; }
  nav { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); overflow:visible; gap:8px; }
  nav button { white-space:normal; text-align:center; min-height:44px; padding:11px 8px; }
  .top > div { min-width:0; flex:1; }
  .top > button { flex-shrink:0; }
  .tablewrap { overflow:visible; }
  .tablewrap table, .tablewrap tbody { display:block; width:100%; }
  .tablewrap thead, .tablewrap tr:has(> th) { display:none; }
  .tablewrap tr:has(> td) { display:block; width:100%; background:#f7f9f5; border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:14px 0; }
  .tablewrap td { display:grid; grid-template-columns:minmax(85px,34%) minmax(0,1fr); gap:6px 12px; width:100%; padding:12px 0; overflow-wrap:anywhere; }
  .tablewrap td::before { content:attr(data-label); font-size:12px; font-weight:650; color:var(--muted); grid-column:1; grid-row:1 / span 6; }
  .tablewrap td > * { grid-column:2; min-width:0; }
  .tablewrap td:last-child { border-bottom:0; }
  .tablewrap td br { display:none; }
  .tablewrap td button { min-height:44px; padding:10px 12px; margin-bottom:4px; }
  .row > input, .row > select { min-width:0; }
  .pill .row > div { min-width:0; flex:1 1 160px; }
  .pill select { max-width:100%; }
  dialog { padding:20px; }
  input, select, textarea { font-size:16px; min-height:44px; }
  .actions { flex-wrap:wrap; }
  .login { margin:24px 16px; max-width:calc(100% - 32px); }
}
@media (max-width:380px) {
  .stats { gap:10px; }
  .stat { padding:14px; }
  .top { gap:10px; }
  .top > button { padding:10px; }
}

.access-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:24px; }
.access-choice { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:108px; padding:16px 10px; background:#f2f5ef; color:#466459; border:2px solid #dce5de; font-size:14px; }
.access-choice span { font-size:25px; }
.access-choice.selected { background:#e4f0e6; border-color:#27695b; color:#173e36; }
.lesson-meta { display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; margin-top:6px; font-size:13px; line-height:1.6; color:var(--muted); } .lesson-meta strong { color:var(--ink); font-weight:650; }
button.remove-reservation { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; } button.remove-reservation:hover { background:#fecaca; }

/* Paleta azul do IFFA: cartões suaves e ações em destaque. */
:root { --ink:#17365b; --green:#1d4ed8; --bg:#eef3f9; --muted:#5c7088; --line:#d6e3f1; }
aside { background:#102f57; }
.brand small { color:#c0d4ed; }
nav button { color:#d3e3f5; }
nav button.active { background:#2456a2; color:#fff; }
nav button:hover { background:#214572; color:#fff; }
nav button.active:hover { background:#2456a2; }
.card { background:#f5f9ff; border-color:#d6e3f1; }
.stat { background:#fff; border-color:#d6e3f1; }
.pill { background:#eaf2fc; }
.eyebrow { color:#53749b; }
button.secondary { background:#dce9fb; color:#183e72; }
button.secondary:hover { background:#cbdff9; }
.badge.paid { background:#15803d; color:#fff; border:1px solid #166534; font-weight:750; padding:6px 13px; }
.login .brand { color:#1d4ed8; }
.access-choice { background:#f0f5fc; color:#46658b; border-color:#d6e3f1; }
.access-choice.selected { background:#e1edff; color:#143c75; border-color:#2563eb; }
@media(max-width:900px) { .tablewrap tr:has(> td) { background:#eaf2fc; border-color:#d6e3f1; } }

.brand { display:flex; align-items:center; gap:12px; }
.brand-word { min-width:0; }
.brand-logo { display:block; flex:0 0 56px; width:56px; height:56px; border-radius:12px; overflow:hidden; background:#333; }
.brand-logo img { display:block; width:100%; height:100%; object-fit:cover; transform:scale(1.8); }
.login .brand-logo { flex-basis:72px; width:72px; height:72px; border-radius:14px; }
.login .brand-word small { font-size:11px; letter-spacing:1.4px; line-height:1.5; }
.access-options { display:block; margin-top:24px; }
@media(max-width:420px) { .login .brand-logo { flex-basis:56px; width:56px; height:56px; } }

.report-heading { margin-top:24px; }
.report-note { font-size:13px; line-height:1.6; margin-top:20px; }
.report-detail { margin-top:22px; border-top:1px solid var(--line); padding-top:16px; }
.report-detail summary { cursor:pointer; font-weight:650; }
@media print {
 body.printing-frequency { background:#fff!important; color:#000!important; padding:0!important; }
 .printing-frequency aside, .printing-frequency main > header, .printing-frequency .screen-only, .printing-frequency #toast { display:none!important; }
 .printing-frequency .shell { display:block!important; min-height:0; }
 .printing-frequency main { padding:0!important; margin:0!important; max-width:none; }
 .printing-frequency .report-card { border:0; box-shadow:none; background:#fff; padding:0!important; }
 .printing-frequency .report-heading { margin-top:0; }
 .printing-frequency .report-totals { display:grid; grid-template-columns:repeat(4,1fr); }
 .printing-frequency .stat { break-inside:avoid; }
 .printing-frequency .tablewrap { overflow:visible; }
 .printing-frequency table { display:table!important; width:100%; font-size:11pt; }
 .printing-frequency thead { display:table-header-group!important; }
 .printing-frequency tbody { display:table-row-group!important; }
 .printing-frequency tr { display:table-row!important; background:#fff!important; break-inside:avoid; }
 .printing-frequency th, .printing-frequency td { display:table-cell!important; padding:10px 6px!important; }
 .printing-frequency td::before { display:none!important; }
 .printing-frequency .badge { background:transparent!important; color:#000!important; border:0!important; font-weight:700; }
 .printing-frequency .report-detail { display:none!important; }
}

/* Cabeçalho do celular: título acima e ações alinhadas em uma linha. */
@media (max-width:900px) {
 #app main > header.top { flex-direction:column; align-items:stretch; gap:16px; margin-bottom:24px; }
 #app main > header.top > div:first-child { width:100%; flex:none; min-width:0; }
 #app main > header.top .eyebrow { letter-spacing:1.5px; line-height:1.5; overflow-wrap:normal; }
 #app main > header.top h1 { margin-bottom:8px; line-height:1.2; }
 #app main > header.top p { margin-bottom:0; line-height:1.5; }
 #app main > header.top > .row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); width:100%; flex:none; gap:10px; }
 #app main > header.top > .row button { width:100%; min-height:46px; padding:12px 10px; white-space:nowrap; }
}

.agenda-toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
.agenda-modes { display:flex; gap:6px; }
.agenda-date { max-width:220px; margin-bottom:18px; }
.week-navigation { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.week-navigation > div { flex:1; min-width:170px; text-align:center; }
.week-navigation small { display:block; margin-top:4px; font-size:12px; }
.week-navigation > button { min-height:44px; }
.week-hint { font-size:13px; line-height:1.6; margin:16px 0; }
.week-grid { display:grid; grid-template-columns:54px repeat(5,minmax(0,1fr)); gap:6px; }
.week-grid > * { min-width:0; }
.week-heading { background:#dbeafe; color:#183e72; border-radius:8px; padding:12px 6px; text-align:center; font-size:12px; display:flex; flex-direction:column; gap:4px; justify-content:center; }
.week-heading strong { font-weight:700; }
.week-heading.week-today { background:#1d4ed8; color:white; }
.week-time { padding:14px 3px; font-size:12px; font-weight:750; }
.week-time small { display:block; font-size:11px; margin-top:5px; font-weight:400; }
.week-cell { background:#fff; border:1px solid #dbe5f0; border-radius:9px; padding:6px; min-height:90px; }
.week-unavailable { background:#edf1f6; color:#77869a; text-align:center; font-size:11px; display:flex; align-items:center; justify-content:center; }
.week-available { font-size:11px; color:#5c7088; margin:10px 0; }
.week-reserve, .week-open { width:100%; padding:9px 4px; border-radius:6px; color:#1e40af; background:#e8f1fe; font-size:12px; }
.week-class { width:100%; text-align:left; display:block; margin-bottom:6px; padding:10px 7px; border-radius:7px; border:1px solid #b9d4fb; background:#e5efff; color:#17365b; white-space:normal; overflow-wrap:anywhere; }
.week-class:last-child { margin-bottom:0; }
.week-class-title { display:block; font-size:11px; font-weight:750; }
.week-teacher { display:block; margin-top:6px; font-size:11px; font-weight:500; }
.week-students { display:grid; gap:4px; margin-top:9px; font-size:12px; font-weight:650; }
.week-students em { display:inline-block; font-size:10px; font-weight:500; font-style:normal; color:#795817; background:#fef3c7; padding:2px 4px; border-radius:4px; }
.week-class-foot { display:block; margin-top:10px; font-size:10px; font-weight:500; }
.week-personal { background:#f0eaff; border-color:#d7c7f5; color:#493474; }
.week-full { border-width:2px; }
.week-mobile { display:none; }
.week-day-tabs { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-bottom:18px; }
.week-day-tabs button { padding:10px 3px; min-height:48px; font-size:12px; }
.week-day-tabs span { display:block; margin-top:4px; }
.week-mobile-heading { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between; margin-bottom:14px; }
@media(max-width:900px) {
 .week-desktop { display:none; }
 .week-mobile { display:block; }
 .agenda-toolbar { align-items:stretch; }
 .agenda-toolbar > button { width:100%; }
 .agenda-modes { width:100%; display:grid; grid-template-columns:1fr 1fr; }
 .week-current { width:100%; }
 .week-navigation { gap:8px; }
 .week-navigation > div { min-width:120px; font-size:13px; }
 .week-navigation > button { padding:10px 14px; }
}

.week-class.week-green, .legend-item.week-green, .session-student.week-green { background:#dcfce7; border-color:#86d8a0; color:#14532d; }
.week-class.week-yellow, .legend-item.week-yellow, .session-student.week-yellow { background:#fef9c3; border-color:#e6d36c; color:#713f12; }
.week-class.week-personal, .legend-item.week-personal, .session-student.week-personal { background:#ede9fe; border-color:#c4b5fd; color:#5b21b6; }
.week-legend { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
.legend-item { border:1px solid; border-radius:7px; padding:7px 10px; font-size:12px; font-weight:650; }
.session-student { border:1px solid; border-radius:10px; padding:14px; margin-top:14px; }
.session-student .lesson-meta, .session-student .lesson-meta strong { color:inherit; }

<script>
'use strict';
function labelMobileTables() {
  document.querySelectorAll('#content table').forEach(table => {
    const labels = Array.from(table.querySelectorAll('th'), th => th.textContent.trim());
    table.querySelectorAll('tr').forEach(row => {
      Array.from(row.children).filter(cell => cell.tagName === 'TD').forEach((cell, index) => {
        cell.dataset.label = labels[index] || '';
      });
    });
  });
}
new MutationObserver(labelMobileTables).observe(document.getElementById('content'), { childList:true, subtree:true });

const KEY='iffa-pilates-demo-v1';const weekdays=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const initial={students:[],therapists:[{id:'f1',name:'Fisioterapeuta 1'},{id:'f2',name:'Fisioterapeuta 2'}],plans:[{id:'p1',name:'Personalizado',freq:1,price:725,early:660,capacity:1},{id:'p2',name:'Personalizado',freq:2,price:1445,early:1320,capacity:1},{id:'p3',name:'Mensal',freq:1,price:245,early:220,capacity:3},{id:'p4',name:'Mensal',freq:2,price:345,early:315,capacity:3},{id:'p5',name:'Mensal',freq:3,price:515,early:475,capacity:3}],slots:{1:['14:00','15:00','16:00','17:00','18:00','19:00'],2:['07:00','08:00','09:00','14:00','17:00','18:00','19:00'],3:['07:00','08:00'],4:['07:00','08:00','09:00','14:00','17:00','18:00','19:00'],5:['07:00','08:00']},bookings:[],attendance:{},pressures:[],payments:[]};
let db=structuredClone(initial);let user=null,page='home',agendaDate=today();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function localDay(date){return new Date(date+'T12:00:00').getDay()}function formatDate(d){return d.split('-').reverse().join('/')}function endTime(t){let [h,m]=t.split(':').map(Number);return `${String(h+Math.floor((m+50)/60)).padStart(2,'0')}:${String((m+50)%60).padStart(2,'0')}`}
function plan(s){return db.plans.find(p=>p.id===s.plan)}function therapist(id){return db.therapists.find(f=>f.id===id)?.name||'Não definido'}function isAdmin(){return user==='admin'}function toast(s){$('toast').textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',6000)}
function showModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function opts(list,sel){return list.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('')}function field(label,html){return `<div><label>${label}</label>${html}</div>`}function input(name,value='',type='text',extra=''){return `<input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}function actions(){return '<div class="actions full"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Salvar</button></div>'}
$('exit').onclick=()=>logout();
const pages={home:['Visão geral','O estúdio em um só lugar'],students:['Alunos','Cadastros, planos e acompanhamento'],agenda:['Agenda e chamada','Aulas de 50 minutos · até 3 alunos por turma'],pressure:['Pressão arterial','Avaliação inicial e registros antes das aulas'],payments:['Mensalidades','Vencimento dia 10 · condição especial até dia 5'],reports:['Relatório de frequência','Presenças e faltas por mês'],settings:['Configurações','Planos, fisioterapeutas e horários']};
function go(p){page=p;render()}function render(){if(!user)return;if(!isAdmin()&&['payments','settings'].includes(page))page='home';$('who').textContent=isAdmin()?'Administração':therapist(user);$('title').textContent=pages[page][0];$('subtitle').textContent=pages[page][1];$('nav').innerHTML=Object.entries(pages).filter(([k])=>isAdmin()||!['payments','settings'].includes(k)).map(([k,v])=>`<button class="${k===page?'active':''}" onclick="go('${k}')">${v[0]}</button>`).join('');window['view_'+page]()}
function visibleStudents(){return isAdmin()?db.students:db.students.filter(s=>db.bookings.some(b=>b.student===s.id&&b.therapist===user))}function canStudent(id){return visibleStudents().some(s=>s.id===id)}
function sessions(date){return db.bookings.filter(b=>(b.date?b.date===date:b.day===localDay(date))&&db.students.some(s=>s.id===b.student&&s.active)).filter(b=>isAdmin()||b.therapist===user)}

function overlaps(a,b){if(a.time!==b.time)return false;if(a.date&&b.date)return a.date===b.date;if(a.date)return localDay(a.date)===b.day;if(b.date)return localDay(b.date)===a.day;return a.day===b.day}

// Avalia cada data separadamente: reposições em semanas distintas não somam vagas.
let dates=b.date?[b.date]:[null,...new Set(matches.filter(x=>x.date).map(x=>x.date))];for(let date of dates){let occupied=group.filter(x=>!x.date||x.date===date);if(occupied.some(x=>plan(db.students.find(s=>s.id===x.student)).capacity===1)||p.capacity===1&&occupied.length)return 'Aula personalizada deve ser exclusiva para um aluno.';if(occupied.length>=p.capacity)return 'Turma sem vagas para esse plano.'}return ''}

 const groups=weeklyGroups(date,time);
 if(!groups.length)return `<div class="week-cell"><p class="week-available">Horário disponível</p>${isAdmin()?`<button class="week-reserve" onclick="reserveWeeklySlot('${date}','${time}')">+ Reservar</button>`:`<button class="week-open" onclick="openAgendaDay('${date}')">Ver dia</button>`}</div>`;
 return `<div class="week-cell">${groups.map(g=>`<button class="week-class ${g.personal?'week-personal':physioCalendarColor(g.therapist)} ${g.bookings.length>=g.capacity?'week-full':''}" onclick="openAgendaDay('${date}')" aria-label="Abrir chamada de ${formatDate(date)}, ${time}, ${esc(therapist(g.therapist))}"><span class="week-class-title">${g.personal?'Personalizado':'Mensal'} · ${g.bookings.length} de ${g.capacity}</span><span class="week-teacher">Fisio: ${esc(therapist(g.therapist))}</span><span class="week-students">${g.bookings.map(b=>{const s=db.students.find(s=>s.id===b.student);return `<span>${esc(s.name)}${b.date?' <em>Reposição</em>':''}</span>`}).join('')}</span><span class="week-class-foot">${g.bookings.length>=g.capacity?'Turma lotada':'Vagas disponíveis'} · Ver chamada →</span></button>`).join('')}</div>`;
}
function view_agenda(){
 const dates=weekDates(agendaDate);if(agendaMode==='week'&&!dates.includes(agendaDate))agendaDate=dates[0];
 const controls=`<div class="agenda-toolbar"><div class="agenda-modes" role="group" aria-label="Visualização da agenda"><button class="${agendaMode==='week'?'':'secondary'}" onclick="setAgendaMode('week')" aria-pressed="${agendaMode==='week'}">Semana</button><button class="${agendaMode==='day'?'':'secondary'}" onclick="setAgendaMode('day')" aria-pressed="${agendaMode==='day'}">Dia / chamada</button></div>${isAdmin()?'<button onclick="bookingForm()">+ Reservar aula / reposição</button>':''}</div>`;
 if(agendaMode==='day'){$('content').innerHTML=`<div class="card">${controls}<div class="agenda-date"><label>Data da chamada</label><input type="date" value="${agendaDate}" onchange="if(this.value){agendaDate=this.value;render()}" required></div><p class="muted">${weekdays[localDay(agendaDate)]} · Horários fixos repetem semanalmente. Reposições valem apenas na data escolhida.</p>${sessionCards(agendaDate)}</div>`;return;}
 const times=[...new Set(dates.flatMap(date=>db.slots[localDay(date)]||[]))].sort();
 const grid=`<div class="week-grid"><div class="week-heading">Horário</div>${dates.map(date=>`<button class="week-heading ${date===today()?'week-today':''}" onclick="openAgendaDay('${date}')"><strong>${weekdays[localDay(date)]}</strong><span>${formatDate(date).slice(0,5)}</span></button>`).join('')}${times.map(time=>`<div class="week-time">${time}<small>${endTime(time)}</small></div>${dates.map(date=>weekCell(date,time)).join('')}`).join('')}</div>`;
 const daysBar=`<div class="week-day-tabs" role="group" aria-label="Dias da semana">${dates.map(date=>`<button class="${agendaDate===date?'':'secondary'}" onclick="chooseWeekDay('${date}')" aria-pressed="${agendaDate===date}">${weekdays[localDay(date)].slice(0,3)}<span>${date.slice(8,10)}</span></button>`).join('')}</div>`;
 $('content').innerHTML=`<div class="card agenda-week-card">${controls}<div class="week-navigation"><button class="secondary" onclick="shiftAgendaWeek(-1)" aria-label="Semana anterior">‹</button><div><strong>${formatDate(dates[0])} — ${formatDate(dates[4])}</strong><small>Segunda a sexta · aulas de 50 minutos</small></div><button class="secondary" onclick="shiftAgendaWeek(1)" aria-label="Próxima semana">›</button><button class="secondary week-current" onclick="agendaDate=today();render()">Semana atual</button></div><p class="muted week-hint">Selecione uma turma para abrir a chamada. Cada cartão mostra os alunos e as vagas por fisioterapeuta.</p>${calendarLegend(dates)}<div class="week-desktop">${times.length?grid:'<p class="empty">Nenhum horário configurado para esta semana.</p>'}</div><div class="week-mobile">${daysBar}<div class="week-mobile-heading"><strong>${weekdays[localDay(agendaDate)]} · ${formatDate(agendaDate)}</strong><button class="secondary" onclick="openAgendaDay('${agendaDate}')">Fazer chamada</button></div>${sessionCards(agendaDate)}</div></div>`;
}

startFirebase();

</script></body></html>
