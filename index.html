<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IFFA Pilates • Gestão do estúdio</title><style>
:root{--ink:#183c38;--green:#27695b;--bg:#f4f6f2;--muted:#697c76;--line:#dce5de}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:var(--green);color:white;padding:12px 18px;border-radius:10px;font-weight:650}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #d59b59;outline-offset:3px}button.secondary{background:#e7eee8;color:var(--ink)}button.danger{background:#a33d3d}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd8ce;border-radius:9px;background:white;color:var(--ink)}textarea{min-height:80px}h1,h2,h3,p{margin-top:0}h1{font-size:30px;letter-spacing:-1px}h2{font-size:21px}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#173e36;color:white;padding:30px 18px;position:sticky;top:0;height:100vh}.brand{font:600 34px Georgia,serif;letter-spacing:2px}.brand small{font:12px system-ui;display:block;color:#bfd2c6;letter-spacing:3px;margin-top:7px}nav{display:grid;gap:6px;margin:38px 0}nav button{background:transparent;text-align:left;color:#cddfd3}nav button.active{background:#31594b;color:white}main{padding:32px 40px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.eyebrow{color:#7a8066;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:24px}.stat{margin:0;background:#fff;padding:20px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:32px;margin-top:10px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-block;background:#e9f2e6;color:#376044;border-radius:25px;padding:5px 10px;font-size:12px}.warning{background:#fff2d9;color:#855d18}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e5ece6;vertical-align:top}th{color:var(--muted);font-size:12px}td button{padding:7px 10px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:35px}.notice{padding:12px 18px;background:#fff2d9;color:#70562e;border-radius:10px;margin-bottom:24px;font-size:13px}.login{max-width:480px;margin:9vh auto;padding:32px}.login .brand{color:var(--green);margin-bottom:25px}.login .brand small{color:var(--muted)}dialog{border:1px solid var(--line);border-radius:18px;padding:28px;width:calc(100% - 32px);max-width:740px;max-height:90vh;color:var(--ink)}dialog::backdrop{background:#16392c80}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}#toast{position:fixed;bottom:24px;right:24px;background:#245e48;color:white;padding:16px 24px;border-radius:12px;z-index:10;max-width:90vw}#toast:empty{display:none}.pill{background:#f0f3ec;border-radius:12px;padding:16px;margin:12px 0}.pressure{background:#fff3db;color:#835c1b;border-radius:8px;padding:7px 10px;font-size:12px}.hidden{display:none!important}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:16px}.brand{font-size:25px}nav{display:flex;overflow:auto;margin:15px 0 0}nav button{white-space:nowrap;padding:9px}aside>small,aside>#exit{display:none}main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.top{align-items:flex-start}h1{font-size:25px}.card{padding:18px}}

/* Layout de celular: conteúdo cabe na tela sem rolagem lateral. */
.shell, main, #content, .card, .grid > *, .fields > * { min-width:0; }
input, select, textarea { max-width:100%; }

<section id="login" class="card login"><div class="brand">IFFA <small>PILATES · GESTÃO DO ESTÚDIO</small></div><h1>Quem está entrando?</h1><p class="muted">Escolha seu acesso e digite sua senha.</p><p class="muted" style="font-size:12px">Versão 7 · cadastro de usuários pelo sistema</p><div class="access-options" role="group" aria-label="Escolha seu acesso"><button id="accessAdmin" type="button" class="access-choice selected" aria-pressed="true" onclick="selectAccess('admin')"><span aria-hidden="true">⚙</span><strong>Administração</strong></button><button id="accessMarina" type="button" class="access-choice" aria-pressed="false" onclick="selectAccess('marina')"><span aria-hidden="true">◉</span><strong>Marina</strong></button></div><button id="reloadLoginList" type="button" class="secondary" style="width:100%;margin-top:12px" onclick="reloadLoginCatalog()">↻ Atualizar nomes</button><form id="enter"><input id="loginEmail" type="hidden" value="iffapilates@gmail.com" autocomplete="username"><label for="loginPassword" style="margin-top:22px">Senha</label><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Digite sua senha"><p id="loginMessage" role="status" class="muted">Conectando…</p><button disabled style="width:100%;margin-top:12px">Entrar →</button></form></section>
<div id="app" class="shell hidden"><aside><div class="brand">IFFA<small>PILATES</small></div><nav id="nav"></nav><small id="who"></small><button id="exit" class="secondary" style="width:100%;margin-top:25px">↪ Sair</button></aside><main><header class="top"><div><div class="eyebrow">Cuidado em movimento</div><h1 id="title"></h1><p id="subtitle" class="muted"></p></div><button class="secondary" onclick="logout()">Sair ↪</button></header><div class="row between notice"><span id="cloudStatus">Conectado ao Firebase</span><button class="secondary" onclick="refreshCloud()">↻ Atualizar dados</button></div><div id="content"></div></main></div>
<dialog id="modal"><div class="row between"><h2 id="modalTitle"></h2><button type="button" class="secondary" onclick="closeModal()" aria-label="Fechar">✕</button></div><div id="modalBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
function labelMobileTables() {
  document.querySelectorAll('#content table').forEach(table => {
    const labels = Array.from(table.querySelectorAll('th'), th => th.textContent.trim());
    table.querySelectorAll('tr').forEach(row => {
      Array.from(row.children).filter(cell => cell.tagName === 'TD').forEach((cell, index) => {
        cell.dataset.label = labels[index] || '';
      });
    });
  });
}
new MutationObserver(labelMobileTables).observe(document.getElementById('content'), { childList:true, subtree:true });

const KEY='iffa-pilates-demo-v1';const weekdays=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const initial={students:[],therapists:[{id:'f1',name:'Fisioterapeuta 1'},{id:'f2',name:'Fisioterapeuta 2'}],plans:[{id:'p1',name:'Personalizado',freq:1,price:725,early:660,capacity:1},{id:'p2',name:'Personalizado',freq:2,price:1445,early:1320,capacity:1},{id:'p3',name:'Mensal',freq:1,price:245,early:220,capacity:3},{id:'p4',name:'Mensal',freq:2,price:345,early:315,capacity:3},{id:'p5',name:'Mensal',freq:3,price:515,early:475,capacity:3}],slots:{1:['14:00','15:00','16:00','17:00','18:00','19:00'],2:['07:00','08:00','09:00','14:00','17:00','18:00','19:00'],3:['07:00','08:00'],4:['07:00','08:00','09:00','14:00','17:00','18:00','19:00'],5:['07:00','08:00']},bookings:[],attendance:{},pressures:[],payments:[]};
let db=structuredClone(initial);let user=null,page='home',agendaDate=today();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function localDay(date){return new Date(date+'T12:00:00').getDay()}function formatDate(d){return d.split('-').reverse().join('/')}function endTime(t){let [h,m]=t.split(':').map(Number);return `${String(h+Math.floor((m+50)/60)).padStart(2,'0')}:${String((m+50)%60).padStart(2,'0')}`}
function plan(s){return db.plans.find(p=>p.id===s.plan)}function therapist(id){return db.therapists.find(f=>f.id===id)?.name||'Não definido'}function isAdmin(){return user==='admin'}function toast(s){$('toast').textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',6000)}
function showModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function opts(list,sel){return list.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('')}function field(label,html){return `<div><label>${label}</label>${html}</div>`}function input(name,value='',type='text',extra=''){return `<input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}function actions(){return '<div class="actions full"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Salvar</button></div>'}
$('exit').onclick=()=>logout();
const pages={home:['Visão geral','O estúdio em um só lugar'],students:['Alunos','Cadastros, planos e acompanhamento'],agenda:['Agenda e chamada','Aulas de 50 minutos · até 3 alunos por turma'],pressure:['Pressão arterial','Avaliação inicial e registros antes das aulas'],payments:['Mensalidades','Vencimento dia 10 · condição especial até dia 5'],settings:['Configurações','Planos, fisioterapeutas e horários']};
function go(p){page=p;render()}function render(){if(!user)return;if(!isAdmin()&&['payments','settings'].includes(page))page='home';$('who').textContent=isAdmin()?'Administração':therapist(user);$('title').textContent=pages[page][0];$('subtitle').textContent=pages[page][1];$('nav').innerHTML=Object.entries(pages).filter(([k])=>isAdmin()||!['payments','settings'].includes(k)).map(([k,v])=>`<button class="${k===page?'active':''}" onclick="go('${k}')">${v[0]}</button>`).join('');window['view_'+page]()}
function visibleStudents(){return isAdmin()?db.students:db.students.filter(s=>db.bookings.some(b=>b.student===s.id&&b.therapist===user))}function canStudent(id){return visibleStudents().some(s=>s.id===id)}
function sessions(date){return db.bookings.filter(b=>(b.date?b.date===date:b.day===localDay(date))&&db.students.some(s=>s.id===b.student&&s.active)).filter(b=>isAdmin()||b.therapist===user)}
function view_home(){let list=sessions(today()),count=new Set(list.map(b=>b.time+'|'+b.therapist)).size;let cards=[['Alunos ativos',visibleStudents().filter(s=>s.active).length],['Aulas hoje',count],['Alunos agendados',list.length],['Aferições pendentes',list.filter(b=>db.students.find(s=>s.id===b.student)?.bp&&!db.pressures.some(p=>p.student===b.student&&p.date===today())).length]];$('content').innerHTML=`<div class="grid stats">${cards.map(([l,n])=>`<div class="stat"><small>${l}</small><b>${n}</b></div>`).join('')}</div><div class="card"><div class="row between"><h2>Hoje no IFFA</h2><span class="badge">${formatDate(today())}</span></div>${sessionCards(today())}</div><div class="card"><h2>Próximos passos</h2><p class="muted">Cadastre os alunos e seus planos, reserve os horários fixos e acompanhe a chamada diariamente.</p><button onclick="go('students')">Ver alunos →</button></div>`}
function view_students(){$('content').innerHTML=`<div class="card"><div class="row between"><input id="search" aria-label="Buscar aluno" placeholder="Buscar aluno por nome…" style="max-width:320px" oninput="studentTable(this.value)">${isAdmin()?'<button onclick="editStudent()">+ Novo aluno</button>':''}</div><div id="studentsTable"></div></div>`;studentTable('')}
function studentTable(q){let list=visibleStudents().filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));$('studentsTable').innerHTML=list.length?`<div class="tablewrap"><table><thead><tr><th>Aluno</th><th>Plano</th><th>Acompanhamento</th><th>Ações</th></tr></thead><tbody>${list.map(s=>`<tr><td><strong>${esc(s.name)}</strong><br><small>${esc(s.phone)} · ${s.active?'Ativo':'Inativo'}</small></td><td>${esc(plan(s)?.name)} · ${plan(s)?.freq}x/semana</td><td>${s.bp?'<span class="pressure">Aferir pressão antes da aula</span>':'—'}</td><td><button class="secondary" onclick="studentDetail('${s.id}')">Histórico</button> ${isAdmin()?`<button onclick="editStudent('${s.id}')">Editar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum aluno encontrado.</div>'}
function editStudent(id){if(!isAdmin())return;let s=db.students.find(s=>s.id===id)||{active:true};showModal(id?'Editar aluno':'Novo aluno',`<form id="studentForm" class="fields">${field('Nome',input('name',s.name,'text','required maxlength="120"'))}${field('Telefone',input('phone',s.phone,'tel'))}${field('Plano',`<select name="plan">${opts(db.plans.map(p=>({...p,name:p.name+' · '+p.freq+'x/semana'})),s.plan)}</select>`)}${field('Status',`<select name="active"><option value="true">Ativo</option><option value="false" ${s.active===false?'selected':''}>Inativo</option></select>`)}<div class="full"><label><input type="checkbox" name="bp" ${s.bp?'checked':''} style="width:auto"> Aferir pressão antes das aulas</label></div><div class="full"><label>Observações da avaliação inicial</label><textarea name="notes" maxlength="10000">${esc(s.notes)}</textarea></div>${actions()}</form>`);$('studentForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let next={id:id||uid(),name:f.get('name').trim(),phone:f.get('phone').trim(),plan:f.get('plan'),active:f.get('active')==='true',bp:f.has('bp'),notes:f.get('notes')};if(!next.name)return;let targetPlan=plan(next),rec=db.bookings.filter(b=>b.student===id&&!b.date);if(rec.length>targetPlan.freq){toast('Remova horários fixos excedentes antes de reduzir a frequência do plano.');return}if(id&&s.plan!==next.plan&&rec.length){toast('Remova as reservas antes de mudar o plano, para revisar as vagas da turma.');return}if(id)Object.assign(s,next);else db.students.push(next);if(!(await save()))return;closeModal();render();toast('Aluno salvo.')};}
function studentDetail(id){if(!canStudent(id))return;let s=db.students.find(s=>s.id===id);let logs=db.pressures.filter(p=>p.student===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));showModal(s.name,`<p>${esc(s.notes)||'Sem observações da avaliação inicial.'}</p><h3>Horários reservados</h3>${db.bookings.filter(b=>b.student===id&&(isAdmin()||b.therapist===user)).map(b=>`<p>${b.date?formatDate(b.date):weekdays[b.day]} · ${b.time}–${endTime(b.time)} · ${esc(therapist(b.therapist))}</p>`).join('')||'<p class="muted">Nenhum horário reservado.</p>'}<h3>Histórico de pressão arterial</h3>${logs.map(p=>`<div class="pill"><b>${p.sys}/${p.dia} mmHg</b> · ${formatDate(p.date)} ${p.time}<br><small>${esc(p.kind)} · ${esc(therapist(p.therapist))}</small><p>${esc(p.notes)}</p></div>`).join('')||'<p class="muted">Sem aferições.</p>'}<h3>Presenças e faltas</h3>${Object.entries(db.attendance).filter(([k])=>k.endsWith('|'+id)).sort().reverse().map(([k,v])=>`<p>${formatDate(k.split('|')[0])} · ${k.split('|')[1]} · ${esc(v)}</p>`).join('')||'<p class="muted">Sem registros.</p>'}`)}
function view_agenda(){$('content').innerHTML=`<div class="card"><div class="row between"><div><label>Data da chamada</label><input type="date" value="${agendaDate}" onchange="if(this.value){agendaDate=this.value;render()}" required></div>${isAdmin()?'<button onclick="bookingForm()">+ Reservar aula / reposição</button>':''}</div><p class="muted" style="margin-top:18px">${weekdays[localDay(agendaDate)]} · Horários fixos repetem semanalmente. Reposições valem apenas na data escolhida.</p>${sessionCards(agendaDate)}</div>`}
function sessionCards(date){let slots=db.slots[localDay(date)]||[],list=sessions(date);if(!slots.length)return '<div class="empty">Sem aulas neste dia.</div>';return slots.map(t=>{let at=list.filter(b=>b.time===t);return `<div class="pill"><div class="row between"><h3 style="margin:0">${t} <small>até ${endTime(t)}</small></h3><span class="badge">${at.length} aluno(s)</span></div>${at.map(b=>{let s=db.students.find(s=>s.id===b.student),key=date+'|'+t+'|'+s.id,val=db.attendance[key]||'Pendente';return `<div style="border-top:1px solid var(--line);padding-top:14px;margin-top:14px"><div class="row between"><div><b>${esc(s.name)}</b><br><small>${esc(therapist(b.therapist))} · ${b.date?'Reposição':esc(plan(s)?.name)}</small></div><select aria-label="Presença de ${esc(s.name)}" style="width:auto" onchange="markAttendance('${esc(key)}',this.value)">${['Pendente','Presente','Falta','Falta justificada'].map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('')}</select></div>${s.bp?'<p class="pressure">Lembrete: aferir pressão antes de iniciar.</p>':''}<div class="row" style="margin-top:10px"><button class="secondary" onclick="pressureForm('${s.id}','${date}')">Registrar pressão</button>${isAdmin()?`<button class="secondary" onclick="removeBooking('${b.id}')">Remover reserva</button>`:''}</div></div>`}).join('')||'<p class="muted" style="margin:12px 0 0">Horário disponível.</p>'}</div>`}).join('')}
async function markAttendance(key,value){let [date,time,id]=key.split('|');if(!sessions(date).some(b=>b.time===time&&b.student===id))return;db.attendance[key]=value;if(!(await save()))return;toast('Chamada atualizada.')}

 sdk.onAuthStateChanged(auth,async account=>{const epoch=++authEpoch;if(stopSync){stopSync();stopSync=null}user=null;baseline=null;db=structuredClone(initial);$('app').classList.add('hidden');$('login').classList.remove('hidden');closeModal();if(!account){$('loginPassword').value='';$('loginMessage').textContent='';await reloadLoginCatalog();return}try{$('loginMessage').textContent='Carregando dados do estúdio…';const access=await resolveAccess(account);user=access.role==='admin'?'admin':access.therapistId;await initializeCloud();await loadCloud(epoch);if(epoch!==authEpoch)return;if(!(await linkInitialMarina()))throw Error('Não foi possível vincular o acesso da Marina. Entre novamente como administração.');if(isAdmin()){try{await repairLoginCatalog()}catch(catalogError){console.error(catalogError);applyChoicesFromState();toast('Os usuários foram carregados, mas a lista de login precisa das regras atualizadas.')}}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('loginMessage').textContent='';render();stopSync=sdk.onSnapshot(sdk.doc(firestore,'controle','versao'),snapshot=>{if(snapshot.metadata.hasPendingWrites)return;if(snapshot.exists()&&snapshot.data().revision!==revision)refreshCloud()},error=>{toast(errorMessage(error));if(error.code==='permission-denied')sdk.signOut(auth)});}catch(error){console.error(error);user=null;$('loginMessage').textContent=errorMessage(error);await sdk.signOut(auth);$('loginMessage').textContent=errorMessage(error);}});
 renderLoginChoices();subscribeLoginCatalog();$('enter').querySelector('button').disabled=false;$('loginMessage').textContent='';
 }catch(error){$('loginMessage').textContent='Não foi possível iniciar o Firebase. Verifique a internet e atualize a página.';console.error(error)}}
function renderLoginChoices(){
 const host=document.querySelector('.access-options');if(!host)return;
 host.innerHTML=Object.entries(LOGIN_ACCOUNTS).filter(([,a])=>a.active!==false).map(([key,a])=>`<button type="button" data-access="${esc(key)}" class="access-choice ${selectedAccess===key?'selected':''}" aria-pressed="${selectedAccess===key}" onclick="selectAccess('${esc(key)}')"><span aria-hidden="true">${key==='admin'?'⚙':'◉'}</span><strong>${esc(a.name)}</strong></button>`).join('');
 if(!LOGIN_ACCOUNTS[selectedAccess]||LOGIN_ACCOUNTS[selectedAccess].active===false)selectAccess('admin');
}
function applyLoginCatalog(snapshot){
 const previous=selectedAccess;for(const key of Object.keys(LOGIN_ACCOUNTS))if(!['admin','marina'].includes(key))delete LOGIN_ACCOUNTS[key];LOGIN_ACCOUNTS.marina.active=true;
 for(const item of snapshot.docs){const entry=item.data(),key=item.id==='f1'?'marina':item.id;LOGIN_ACCOUNTS[key]={name:entry.name,email:entry.email||(key==='marina'?'marinaferreira1314@gmail.com':''),active:entry.active};}
 if(!LOGIN_ACCOUNTS[previous]||LOGIN_ACCOUNTS[previous].active===false)selectedAccess='admin';
 $('loginEmail').value=LOGIN_ACCOUNTS[selectedAccess].email;renderLoginChoices();
}
let accountCreation=false;
async function provisionAccount(name,password,target){
 if(!isAdmin()||accountCreation||saving)return false;accountCreation=true;
 const primaryUid=auth.currentUser.uid;const backup=structuredClone(db);let isolatedApp,created=null,committed=false;
 const form=$('therapistForm');if(form)form.inert=true;$('app').inert=true;
 try {
   // Conta técnica sem caixa de e-mail. A senha nunca é gravada no Firestore.
   const email='u-'+crypto.randomUUID().replaceAll('-','')+'@login.iffa-d75d1.invalid';
   isolatedApp=sdk.initializeApp(firebaseConfig,'cadastro-'+crypto.randomUUID());const isolatedAuth=sdk.getAuth(isolatedApp);
   await sdk.setPersistence(isolatedAuth,sdk.inMemoryPersistence);
   created=await sdk.createUserWithEmailAndPassword(isolatedAuth,email,password);
   if(auth.currentUser?.uid!==primaryUid||!isAdmin())throw Error('Sua sessão mudou. Entre novamente antes de cadastrar usuários.');
   target.authUid=created.user.uid;target.loginEmail=email;target.authActive=true;target.initialMarinaLinked=true;
   const index=db.therapists.findIndex(f=>f.id===target.id);if(index<0)db.therapists.push(target);else db.therapists[index]=target;
   if(!(await save()))return false;
   committed=true;return true;
 }catch(error){db=backup;toast(errorMessage(error));return false}
 finally{if(created&&!committed){try{await sdk.deleteUser(created.user)}catch(error){console.error(error);toast('Cadastro não concluído. A conta criada ficou sem acesso ao estúdio; tente novamente.')}}if(isolatedApp){try{await sdk.deleteApp(isolatedApp)}catch(error){console.error(error)}}accountCreation=false;if(form)form.inert=false;$('app').inert=false;}
}
function manageUser(id){if(!isAdmin())return;const f=db.therapists.find(t=>t.id===id),isNew=!f;
 showModal(isNew?'Novo usuário':'Editar usuário',`<form id="therapistForm" class="fields">${field('Nome',input('name',f?.name,'text','required maxlength="120" autocomplete="off"'))}${field('Tipo de acesso',`<select name="accessRole"><option value="physio">Fisioterapeuta</option><option value="admin" ${f?.accessRole==='admin'?'selected':''}>Administração</option></select>`)}${field(isNew?'Senha inicial':'Nova senha (deixe vazio para manter)',input('password','','password',`${isNew?'required':''} minlength="8" autocomplete="new-password"`))}${isNew?'':field('Status',`<select name="authActive"><option value="true">Ativo</option><option value="false" ${f.authActive===false?'selected':''}>Desativado</option></select>`)}<p class="full muted">A pessoa escolhe o nome na tela de entrada e digita a senha. Use pelo menos 8 caracteres.</p>${actions()}</form>`);
 $('therapistForm').onsubmit=async e=>{e.preventDefault();if(accountCreation||saving)return;const fields=e.target.elements,name=fields.name.value.trim(),password=fields.password.value;
 if(!name)return;const key=name.toLocaleLowerCase('pt-BR');if(key==='administração'||key==='administracao'||db.therapists.some(t=>t.id!==id&&t.name.toLocaleLowerCase('pt-BR')===key)){toast('Escolha um nome de acesso diferente dos existentes.');return}
 const target=f||{id:uid()};const backup=structuredClone(db);target.name=name;target.accessRole=fields.accessRole.value;target.authActive=isNew||fields.authActive.value==='true';
 if(password){if(password.length<8){toast('A senha deve ter pelo menos 8 caracteres.');return}if(!(await provisionAccount(name,password,target))){if(!saving)db=structuredClone(baseline||backup);render();return}}
 else if(isNew){db=backup;toast('Informe a senha inicial.');return}else if(!(await save()))return;
 closeModal();render();toast(isNew?'Usuário criado. Ele já pode entrar pelo nome.':password?'Nova senha definida. A senha anterior não permite mais o acesso.':'Usuário atualizado.');
 };
}
function editTherapist(id){manageUser(id)}

let stopCatalog=null;
function applyChoicesFromState(){
 if(!isAdmin())return;
 applyLoginCatalog({docs:db.therapists.filter(f=>f.authUid).map(f=>({id:f.id,data:()=>({name:f.name,email:f.loginEmail||'',active:f.authActive!==false})}))});
}
async function reloadLoginCatalog(){
 if(!sdk||!firestore)return false;
 const button=$('reloadLoginList');if(button)button.disabled=true;
 try{const snapshot=await sdk.getDocsFromServer(sdk.collection(firestore,'acessos'));applyLoginCatalog(snapshot);$('loginMessage').textContent='';return true}
 catch(error){console.error(error);$('loginMessage').textContent=error.code==='permission-denied'?'A lista de usuários está bloqueada. Publique as regras do pacote mais recente no Firestore.':'Não foi possível atualizar os nomes. Confira a internet e tente novamente.';return false}
 finally{if(button)button.disabled=false;}
}
function subscribeLoginCatalog(){
 if(stopCatalog)stopCatalog();
 stopCatalog=sdk.onSnapshot(sdk.collection(firestore,'acessos'),applyLoginCatalog,error=>{console.error(error);$('loginMessage').textContent='A lista de usuários não pôde ser atualizada. Use Atualizar nomes ou confira as novas regras do Firestore.';});
}
async function repairLoginCatalog(){
 if(!isAdmin())return;
 const ref=sdk.collection(firestore,'acessos');const existing=await sdk.getDocsFromServer(ref);
 const actual=new Map(existing.docs.map(d=>[d.id,d.data()]));const changes=[];
 for(const f of db.therapists){if(!f.authUid)continue;const wanted={name:f.name,email:f.loginEmail||'',active:f.authActive!==false};const found=actual.get(f.id);if(!found||found.name!==wanted.name||found.email!==wanted.email||found.active!==wanted.active)changes.push({id:f.id,data:wanted});}
 if(changes.length){const expected=revision;await sdk.runTransaction(firestore,async tx=>{const metaRef=sdk.doc(firestore,'controle','versao'),meta=await tx.get(metaRef);if(meta.data().revision!==expected)throw Error('Os usuários mudaram em outro aparelho. Atualize os dados e tente novamente.');for(const item of changes)tx.set(sdk.doc(firestore,'acessos',item.id),item.data);tx.set(metaRef,{revision:expected+1,updatedBy:auth.currentUser.uid,updatedAt:sdk.serverTimestamp()});});revision=expected+1;}
 applyChoicesFromState();
}

startFirebase();

</script></body></html>
